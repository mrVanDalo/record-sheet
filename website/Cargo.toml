[package]
name = "record-sheet-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.127" # keep in lockstep with nixpkgs wasm-bindgen-cli (see flake.nix)
jiff = { version = "0.2.37", default-features = false, features = ["alloc"] }
record-sheet = { path = ".." }
